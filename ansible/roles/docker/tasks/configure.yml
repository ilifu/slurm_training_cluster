---
# Configure Docker daemon and ensure docker group exists

- name: Ensure docker group exists with GID 987
  become: yes
  group:
    name: docker
    gid: 987
    state: present
    system: yes

- name: Ensure Docker daemon is started
  become: yes
  systemd:
    name: docker
    state: started
    daemon_reload: yes