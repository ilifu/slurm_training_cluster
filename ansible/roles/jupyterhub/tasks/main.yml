---
# tasks file for jupyterhub
# Install JupyterHub with SlurmSpawner on login node

- name: Install system dependencies for JupyterHub
  become: yes
  tags: [jupyterhub, build]
  block:
    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install required system packages
      apt:
        name:
          - python3-venv
          - python3-dev
          - build-essential
          - git
          - npm
        state: present

- name: Create jupyter user and group
  become: yes
  tags: [jupyterhub, build]
  block:
    - name: Create jupyter group
      group:
        name: "{{ jupyterhub.jupyter_group }}"
        state: present
        system: yes

    - name: Create jupyter user
      user:
        name: "{{ jupyterhub.jupyter_user }}"
        group: "{{ jupyterhub.jupyter_group }}"
        home: "/var/lib/jupyterhub"
        shell: /sbin/nologin
        state: present
        system: yes

- name: Setup JupyterHub virtual environment and packages
  become: yes
  become_user: root
  tags: [jupyterhub, build]
  block:
    - name: Create JupyterHub log directory
      file:
        path: /var/log/jupyterhub
        state: directory
        owner: "{{ jupyterhub.jupyter_user }}"
        group: "{{ jupyterhub.jupyter_group }}"
        mode: '0755'

    - name: Create JupyterHub directories
      file:
        path: "{{ item }}"
        state: directory
        owner: "{{ jupyterhub.jupyter_user }}"
        group: "{{ jupyterhub.jupyter_group }}"
        mode: '0755'
      loop:
        - "{{ jupyterhub_python_venv }}"
        - "{{ jupyterhub_config_dir }}"
        - "{{ jupyterhub_data_dir }}"

    - name: Create Python virtual environment for JupyterHub
      command:
        cmd: "python3 -m venv {{ jupyterhub_python_venv }}"
        creates: "{{ jupyterhub_python_venv }}/bin/python"

    - name: Upgrade pip in virtual environment
      pip:
        name: pip
        state: latest
        virtualenv: "{{ jupyterhub_python_venv }}"
        virtualenv_command: "python3 -m venv"

    - name: Install JupyterHub and dependencies
      pip:
        name:
          - "jupyterhub=={{ jupyterhub.version }}"
          - jupyterlab
          - batchspawner
          - "notebook>=6.1"
        state: present
        virtualenv: "{{ jupyterhub_python_venv }}"
        virtualenv_command: "python3 -m venv"

    - name: Install Node.js packages for JupyterLab
      command:
        cmd: "{{ jupyterhub_python_venv }}/bin/pip install jupyterlab_server"
      changed_when: false

- name: Install nvm, node.js and configurable-http-proxy
  tags: [jupyterhub, build,nvm,nodejs,configurable-http-proxy]
  vars:
    nvm_dir: /usr/local/nvm
  block:
    - name: Install nvm (Node Version Manager)
      become: yes
      shell: |
        export NVM_DIR="{{ nvm_dir }}"
        mkdir -p $NVM_DIR
        curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh | bash
      args:
        creates: "{{ nvm_dir }}/nvm.sh"
    - name: Make nvm available to all users
      become: yes
      copy:
        dest: /etc/profile.d/nvm.sh
        content: |
          export NVM_DIR="{{ nvm_dir }}"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"  # This loads nvm
            [ -s "$NVM_DIR/bash_completion" ] && \. "$NVM_DIR/bash_completion"  # This loads nvm bash_completion
    - name: Install Node.js using nvm
      become: yes
      shell: |
        export NVM_DIR="{{ nvm_dir }}"
        [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
        nvm install --lts
      args:
        executable: /bin/bash
        creates: "{{ nvm_dir }}/versions"

    - name: Install configurable-http-proxy globally using npm
      become: yes
      shell: |
        export NVM_DIR="{{ nvm_dir }}"
        [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
        npm install -g configurable-http-proxy
      args:
        executable: /bin/bash

    - name: Find configurable-http-proxy binary location
      become: yes
      shell: |
        export NVM_DIR="{{ nvm_dir }}"
        [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
        which configurable-http-proxy
      args:
        executable: /bin/bash
      register: chp_binary_path
      changed_when: false

    - name: Create symlink for configurable-http-proxy in /usr/local/bin
      become: yes
      file:
        src: "{{ chp_binary_path.stdout | trim }}"
        dest: /usr/local/bin/configurable-http-proxy
        state: link
        force: yes

    - name: Find node binary location
      become: yes
      shell: |
        export NVM_DIR="{{ nvm_dir }}"
        [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
        which node
      args:
        executable: /bin/bash
      register: node_binary_path
      changed_when: false

    - name: Create symlink for node in /usr/local/bin
      become: yes
      file:
        src: "{{ node_binary_path.stdout | trim }}"
        dest: /usr/local/bin/node
        state: link
        force: yes


- name: Configure JupyterHub
  become: yes
  tags: [jupyterhub, config]
  block:
    - name: Deploy JupyterHub configuration
      template:
        src: jupyterhub_config.py.j2
        dest: "{{ jupyterhub_config_dir }}/jupyterhub_config.py"
        owner: "{{ jupyterhub.jupyter_user }}"
        group: "{{ jupyterhub.jupyter_group }}"
        mode: '0644'
      notify:
        - Restart JupyterHub

    - name: Deploy JupyterHub systemd service file
      template:
        src: jupyterhub.service.j2
        dest: /etc/systemd/system/jupyterhub.service
        owner: root
        group: root
        mode: '0644'
      notify:
        - Restart JupyterHub

    - name: Ensure JupyterHub service is enabled
      systemd:
        name: jupyterhub
        enabled: yes
        daemon_reload: yes

    - name: Ensure JupyterHub service is started
      systemd:
        name: jupyterhub
        state: started

- name: Configure Caddy reverse proxy for JupyterHub
  become: yes
  tags: [jupyterhub, caddy]
  block:
    - name: Debug - Show caddy variable
      debug:
        var: caddy

    - name: Deploy JupyterHub Caddy configuration
      template:
        src: caddy_jupyterhub.conf.j2
        dest: "{{ caddy.config_dir }}/jupyterhub.conf"
        owner: root
        group: caddy
        mode: '0644'
      notify:
        - Validate Caddy configuration
        - Reload Caddy
      when: caddy.install|bool == true
