<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Mortarboard cap -->
  <g id="mortarboard">
    <!-- Tassel -->
    <line x1="50" y1="45" x2="50" y2="65" stroke="#2563eb" stroke-width="2"/>
    <circle cx="50" cy="68" r="3" fill="#2563eb"/>

    <!-- Mortarboard (top flat part) -->
    <polygon points="15,45 50,25 85,45 70,50 30,50" fill="#1e40af" stroke="#1e3a8a" stroke-width="1.5"/>

    <!-- Board front edge/lip -->
    <path d="M 15 45 L 30 50 L 70 50 L 85 45" fill="#2563eb" stroke="#1e3a8a" stroke-width="1"/>

    <!-- Cap underside/graduation gown connection -->
    <ellipse cx="50" cy="48" rx="28" ry="8" fill="#3b82f6" opacity="0.6"/>
  </g>

  <!-- Decorative circle background (optional, for visibility at small sizes) -->
  <circle cx="50" cy="50" r="48" fill="none" stroke="#2563eb" stroke-width="1" opacity="0.3"/>
</svg>