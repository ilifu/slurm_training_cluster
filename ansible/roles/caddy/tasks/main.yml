---
# tasks file for caddy
# Install and configure Caddy reverse proxy with hierarchical configuration

- name: Install Caddy web server
  become: yes
  tags: [caddy, build]
  block:
    - name: Add Caddy official repository key
      apt_key:
        url: https://dl.caddy.community/linux/caddy/gpg.key
        state: present

    - name: Add Caddy official repository
      apt_repository:
        repo: "deb [trusted=yes] https://dl.caddy.community/linux/caddy any main"
        state: present
        filename: caddy

    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install caddy package
      apt:
        name: caddy
        state: present

- name: Configure Caddy with hierarchical configuration
  become: yes
  tags: [caddy, config]
  block:
    - name: Create Caddy service config directory for per-service configs
      file:
        path: "{{ caddy.config_dir }}"
        state: directory
        owner: root
        group: caddy
        mode: '0755'

    - name: Create main Caddyfile with import directive
      template:
        src: Caddyfile.j2
        dest: /etc/caddy/Caddyfile
        owner: root
        group: caddy
        mode: '0644'
      notify:
        - Validate Caddy configuration
        - Reload Caddy

    - name: Ensure Caddy service is enabled and started
      systemd:
        name: caddy
        enabled: yes
        state: started
