---
# tasks file for caddy
# Install and configure Caddy reverse proxy with hierarchical configuration

- name: Install Caddy web server
  become: yes
  tags: [caddy, build]
  block:
    - name: Install dependencies for Caddy repository
      apt:
        name:
          - debian-keyring
          - debian-archive-keyring
          - apt-transport-https
          - curl
        state: present
        update_cache: yes

    - name: Download and add Caddy GPG key
      shell: |
        curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' | gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
      args:
        creates: /usr/share/keyrings/caddy-stable-archive-keyring.gpg

    - name: Add Caddy repository list
      shell: |
        curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' | tee /etc/apt/sources.list.d/caddy-stable.list
      args:
        creates: /etc/apt/sources.list.d/caddy-stable.list

    - name: Set proper permissions on Caddy keyring
      file:
        path: /usr/share/keyrings/caddy-stable-archive-keyring.gpg
        mode: '0644'

    - name: Set proper permissions on Caddy sources list
      file:
        path: /etc/apt/sources.list.d/caddy-stable.list
        mode: '0644'

    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install caddy package
      apt:
        name: caddy
        state: present

- name: Configure Caddy with hierarchical configuration
  become: yes
  tags: [caddy, config]
  block:
    - name: Create Caddy service config directory for per-service configs
      file:
        path: "{{ caddy.config_dir }}"
        state: directory
        owner: root
        group: caddy
        mode: '0755'

    - name: Create main Caddyfile with import directive
      template:
        src: Caddyfile.j2
        dest: /etc/caddy/Caddyfile
        owner: root
        group: caddy
        mode: '0644'
      notify:
        - Validate Caddy configuration
        - Reload Caddy

    - name: Ensure Caddy service is enabled and started
      systemd:
        name: caddy
        enabled: yes
        state: started
