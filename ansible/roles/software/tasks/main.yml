---
# tasks file for software

- name: Wait for /software mount point to be available
  wait_for:
    path: /software
    state: present
    timeout: 300
  become: yes

- name: Ensure /software directory is accessible
  stat:
    path: /software
  register: software_mount
  become: yes

- name: Fail if /software is not mounted
  fail:
    msg: "/software directory is not available or not mounted"
  when: not software_mount.stat.exists

- name: Clone ilifu/software repository to /software/software
  git:
    repo: https://github.com/ilifu/software.git
    dest: /software/software
    force: yes
    version: HEAD
  become: yes
  register: software_clone_result

- name: Set proper ownership on cloned repository
  file:
    path: /software/software
    owner: root
    group: root
    recurse: yes
    mode: '0755'
  become: yes
  when: software_clone_result is succeeded

- name: Check if ansible group_vars file exists
  stat:
    path: /software/software/ansible/group_vars/all
  register: group_vars_file
  become: yes

- name: Update admin_group setting in software repository
  lineinfile:
    path: /software/software/ansible/group_vars/all
    regexp: '^(\s*)admin_group:\s*"ubuntu"'
    line: '\1admin_group: "admin"'
    backup: yes
    backrefs: yes
  become: yes
  when: 
    - software_clone_result is succeeded
    - group_vars_file.stat.exists

- name: Log completion
  debug:
    msg: "Software repository cloned to /software/software and admin_group configured"
  when: software_clone_result is succeeded
