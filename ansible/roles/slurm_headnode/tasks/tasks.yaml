- name: Ensure ssh agent forwarding is allowed
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ".*AllowAgentForwarding.*"
    line: "AllowAgentForwarding yes"

- name: Configure password authentication based on variable
  tags: password_login
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PasswordAuthentication.*"
    line: "PasswordAuthentication {{ 'yes' if password_login_enabled else 'no' }}"
  notify: restart sshd

- name: Override cloud-init SSH config that disables password auth
  tags: password_login
  become: yes
  file:
    path: /etc/ssh/sshd_config.d/60-cloudimg-settings.conf
    state: absent
  when: password_login_enabled
  notify: restart sshd

- name: Update MOTD
  block:
    - name: Remove default motds
      ignore_errors: yes
      file:
          path: "/etc/update-motd.d/{{ item }}"
          mode: "ugo-x"
      with_items:
          - "51-cloudguest"
          - "91-release-upgrade"
          - "98-reboot-required"
          - "10-help-text"
          - "80-esm"
          - "95-hwe-eol"
          - "50-landscape-sysinfo"
          - "80-livepatch"
          - "97-overlayroot"
          - "50-motd-news"
          - "90-updates-available"
          - "98-fsck-at-reboot"
    - name: Add cbio ilifu slurm message
      template:
        src: 50-welcome.j2
        dest: /etc/update-motd.d/50-welcome-slurm
        owner: root
        group: root
        mode: "ug=rwx,o=rx"
  tags:
    - "motd"

- name: Ensure ubuntu bin dir exists
  become: no
  file:
      path: "~/bin"
      state: directory
      owner: ubuntu
      group: ubuntu
      mode: "u=rwx,go=rx"

- name: Copy user-management scripts to headnode
  tags:
    - user_management
  become: no
  vars:
    dcs: "dc={% for element in ldap.dns_domain_name.split('.') %}{{ element }}{% if not loop.last %},dc={% endif %}{% endfor %}"
  template:
    src: "{{ item }}"
    dest: "~/bin/{{ item }}"
    mode: "ugo=rx"
  loop:
    - add_user.py
    - update_password.py
    - manage_groups.py

- name: Copy SLURM initialization script to system directory
  tags:
    - user_management  
  become: yes
  template:
    src: "init_slurm_accounts.sh"
    dest: "/usr/local/bin/init_slurm_accounts"
    mode: "u=rwx,go=rx"
    owner: root
    group: root

- name: Create passwordless sudo group for admin users
  tags:
    - user_management
    - sudo_config
  become: yes
  block:
    - name: Create admin group
      group:
        name: admin
        state: present
        
    - name: Configure passwordless sudo for admin group
      lineinfile:
        path: /etc/sudoers.d/90-admin-nopasswd
        line: "%admin ALL=(ALL) NOPASSWD:ALL"
        create: yes
        mode: '0440'
        owner: root
        group: root
        validate: visudo -cf %s

- name: Ensure .venv exists for user-management scripts
  tags:
    - user_management
  become: no
  pip:
    name:
      - coloredlogs
      - ldap3
      - sshpubkeys
    virtualenv: ~/bin/.venv

- name: Deploy sinteractive script for interactive SLURM jobs
  tags:
    - slurm_tools
  become: yes
  copy:
    src: sinteractive
    dest: /usr/local/bin/sinteractive
    owner: root
    group: root
    mode: "ugo=rx"
