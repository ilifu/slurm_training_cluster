---
# Global Ansible defaults - single source of truth for all roles
# This file is symlinked to by all roles/*/defaults/main.yml

## ============================================================================
## Infrastructure & Services Configuration
## ============================================================================

caddy:
  install: false
  domain: "training.ilifu.ac.za"
  email: "admin@training.ilifu.ac.za"
  acme_provider: "letsencrypt"
  port_http: 80
  port_https: 443
  config_dir: /etc/caddy/conf.d

docker:
  install: false
  user_docker: false
  add_users_to_docker_group: false

docker_privileged_users: []

jupyterhub:
  install: false
  version: "5.4.2"
  admin_users:
    - ubuntu
  jupyter_user: jupyter
  jupyter_group: jupyter
  spawner_type: "slurm"
  spawner_config:
    partition: "training"
    memory: "4G"
    cpus: 2
    time_limit: "05:00:00"
    prologue: ""
    epilogue: ""
  service:
    ip: "127.0.0.1"
    port: 8000
    allow_root: false
  authenticator: "pam"
  notebook_dir: "/home/{username}"

jupyterhub_python_venv: "/opt/jupyterhub/venv"
jupyterhub_config_dir: "/etc/jupyterhub"
jupyterhub_data_dir: "/var/lib/jupyterhub"

jupyterlab:
  install: false
  version: "4.5.0"
  jupyter_user: jupyter
  jupyter_group: jupyter

jupyterlab_python_venv: "/opt/jupyterlab/venv"
jupyterlab_config_dir: "/etc/jupyterlab"
jupyterlab_data_dir: "/var/lib/jupyterlab"

